  <style>
    /* ── 滑块通用样式 ── */
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 3px;
      background: #d1d5db; outline: none;
      touch-action: none;  /* 防止滑动滑块时页面滚动 */
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: #ec4899; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2); cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: #ec4899; border: 2px solid #fff; cursor: pointer;
    }
    .smart-slider::-webkit-slider-thumb { background: #a855f7; }
    .smart-slider::-moz-range-thumb      { background: #a855f7; }

    /* ── 画布容器 ── */
    .canvas-wrapper {
      position: relative; width: 100%; max-height: 60vh;
      display: flex; align-items: center; justify-content: center;
      background: #1f2937; border-radius: 12px; overflow: hidden;
      touch-action: manipulation; /* 允许双指缩放，阻止双击缩放 */
    }
    canvas { display: block; max-width: 100%; max-height: 60vh; object-fit: contain; }

    /* ── 开关 (Toggle) 样式 ── */
    .toggle-track {
      width: 44px; height: 24px; border-radius: 12px;
      background: #374151; transition: background 0.2s;
    }
    .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: transform 0.2s;
    }
    input:checked + .toggle-track { background: #a855f7; }
    input:checked + .toggle-track .toggle-knob { transform: translateX(20px); }

    /* ── 预设横向滚动容器 ── */
    .preset-scroll {
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      touch-action: pan-x; /* 仅允许水平滑动 */
    }
    .preset-scroll::-webkit-scrollbar { display: none; }

    /* ── 预设卡片 ── */
    .preset-card {
      transition: transform 0.1s ease, background-color 0.15s;
    }
    .preset-card:active {
      transform: scale(0.94);
    }
    .preset-card .delete-btn {
      opacity: 0;
      transition: opacity 0.15s;
    }
    .preset-card:hover .delete-btn,
    .preset-card:active .delete-btn {
      opacity: 1;
    }
    @media (hover: none) {
      .preset-card .delete-btn { opacity: 0.6; }
    }

    /* ── 裁剪比例按钮 ── */
    .crop-ratio-btn.active {
      background: #7c3aed; color: #fff;
    }

    /* ── 滤镜卡片 ── */
    .filter-card {
      transition: transform 0.1s ease, border-color 0.15s;
      border: 2px solid transparent;
    }
    .filter-card.active {
      border-color: #a855f7;
      transform: scale(1.03);
    }
    .filter-card:active { transform: scale(0.94); }

    /* ── cropperjs 暗色主题覆盖 ── */
    .cropper-modal { background-color: #000; opacity: 0.6; }
    .cropper-view-box { outline-color: rgba(236, 72, 153, 0.7); }
    .cropper-face { background-color: transparent; }

    /* ── 安装按钮呼吸动画 ── */
    @keyframes install-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50%      { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);   }
    }
    .install-btn-pulse {
      animation: install-pulse 2s ease-in-out infinite;
    }
  </style>
</head>

            <span>液化强度</span>
            <span id="liquifyStrVal">30</span>
          </div>
          <input type="range" id="liquifyStrength" min="10" max="50" value="30" step="1">
        </div>
        <button id="resetLiquifyBtn"
          class="w-full py-2 bg-gray-700 hover:bg-gray-600 active:scale-[0.98] rounded-lg text-xs font-medium transition">
          重置液化
        </button>
      </div>

      <!-- 保存预设 + 保存照片 -->
      <button id="savePresetBtn"
        class="w-full flex items-center justify-center gap-2 py-2.5 bg-violet-600 hover:bg-violet-700 active:scale-[0.98] rounded-lg text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
        </svg>
        保存预设
      </button>

      <button id="savePhotoBtn"
        class="w-full flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-pink-600 to-violet-600
          hover:from-pink-500 hover:to-violet-500 active:scale-[0.98] rounded-lg text-sm font-bold transition shadow-lg shadow-pink-600/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        保存照片
      </button>

      <!-- ── 导出格式选项 ── -->
      <div class="flex items-center gap-3 text-xs text-gray-500 mt-1">
        <span>格式</span>
        <button id="fmtJPEG" class="export-fmt-btn px-2.5 py-1 rounded bg-pink-600 text-white text-xs transition" data-fmt="jpeg">JPEG</button>
        <button id="fmtPNG"  class="export-fmt-btn px-2.5 py-1 rounded bg-gray-700 text-gray-400 hover:bg-gray-600 text-xs transition" data-fmt="png">PNG</button>
        <button id="fmtWebP" class="export-fmt-btn px-2.5 py-1 rounded bg-gray-700 text-gray-400 hover:bg-gray-600 text-xs transition" data-fmt="webp">WebP</button>
        <span class="ml-auto">质量</span>
        <span id="exportQualityVal">90%</span>
      </div>
      <input type="range" id="exportQuality" min="50" max="100" value="90" step="1" class="mt-0.5">

      <!-- ── 分隔线 + 智能美颜开关 ── -->
      <div class="border-t border-gray-800 pt-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-sm font-medium text-gray-300">智能美颜</span>
          <span id="detectionStatus" class="text-xs px-2 py-0.5 rounded-full bg-gray-800 text-gray-500">
            模型未加载
          </span>
        </div>
        <label class="relative inline-flex cursor-pointer">
          <input type="checkbox" id="smartBeautyToggle" class="sr-only peer">
          <span class="toggle-track block relative">
            <span class="toggle-knob block"></span>
          </span>
        </label>
      </div>

      <!-- ── 智能美颜滑块（默认隐藏） ── -->
      <div id="smartSliders" class="space-y-4 hidden">
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>磨皮强度</span>
            <span id="smoothingVal">50%</span>
          </div>
          <input type="range" id="smoothing" class="smart-slider" min="0" max="100" value="50" step="1">
        </div>
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>红眼消除</span>
            <span id="redEyeVal">50%</span>
          </div>
          <input type="range" id="redEye" class="smart-slider" min="0" max="100" value="50" step="1">
        </div>
        <!-- 瘦脸 -->
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>瘦脸</span>
            <span id="slimFaceVal">0%</span>
          </div>
          <input type="range" id="slimFace" class="smart-slider" min="0" max="100" value="0" step="1">
        </div>
        <!-- 小头 -->
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>小头</span>
            <span id="smallHeadVal">0%</span>
          </div>
          <input type="range" id="smallHead" class="smart-slider" min="0" max="100" value="0" step="1">
        </div>
        <!-- 大眼 -->
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>大眼</span>
            <span id="bigEyeVal">0%</span>
          </div>
          <input type="range" id="bigEye" class="smart-slider" min="0" max="100" value="0" step="1">
        </div>
        <!-- 牙齿美白 -->
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>牙齿美白</span>
            <span id="teethWhitenVal">0%</span>
          </div>
          <input type="range" id="teethWhiten" class="smart-slider" min="0" max="100" value="0" step="1">
        </div>
      </div>

      <!-- ── LUT 滤镜选择 ── -->
      <div class="border-t border-gray-800 pt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">滤镜</span>
          <button id="uploadLUTBtn" class="text-xs text-violet-400 hover:text-violet-300 transition">+ 自定义</button>
          <input type="file" id="lutFileInput" accept="image/*" class="hidden">
        </div>
        <div id="filterList" class="preset-scroll flex gap-2.5 overflow-x-auto pb-1">
          <!-- 动态渲染 -->
        </div>
        <!-- 滤镜强度（默认隐藏，选中非原图滤镜后显示） -->
        <div id="filterStrengthRow" class="mt-3 hidden">
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>滤镜强度</span>
            <span id="filterStrengthVal">100%</span>
          </div>
          <input type="range" id="filterStrength" class="smart-slider" min="0" max="100" value="100" step="1">
        </div>
      </div>

      <!-- ── 预设列表 ── -->
      <div class="border-t border-gray-800 pt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">预设</span>
        </div>
        <div id="presetListContainer" class="preset-scroll flex gap-2 overflow-x-auto pb-1">
        </div>
      </div>

      <!-- ── 基础调整滑块 ── -->
      <div class="border-t border-gray-800 pt-4 space-y-4">
        <div class="flex justify-between text-xs text-gray-500 mb-1">
          <span>基础调整</span>
        </div>
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>亮度</span>
            <span id="brightnessVal">100%</span>
          </div>
          <input type="range" id="brightness" min="0" max="200" value="100" step="1">
        </div>
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>对比度</span>
            <span id="contrastVal">100%</span>
          </div>
          <input type="range" id="contrast" min="0" max="200" value="100" step="1">
        </div>
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1.5">
            <span>饱和度</span>
            <span id="saturateVal">100%</span>
          </div>
          <input type="range" id="saturate" min="0" max="200" value="100" step="1">
        </div>
      </div>

      <!-- ── 水印设置 ── -->
      <div class="border-t border-gray-800 pt-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">水印</span>
          <label class="relative inline-flex cursor-pointer">
            <input type="checkbox" id="watermarkToggle" class="sr-only peer">
            <span class="toggle-track block relative">
              <span class="toggle-knob block"></span>
            </span>
          </label>
        </div>
        <div id="watermarkSettings" class="space-y-3 hidden">
          <input type="text" id="watermarkText" maxlength="30" placeholder="输入水印文字"
            class="w-full bg-gray-800 text-white text-sm px-3 py-2 rounded-lg border border-gray-700 focus:border-pink-500 outline-none">
          <div class="flex gap-2">
            <button class="wm-pos-btn px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-400 hover:bg-gray-600 transition" data-pos="tl">左上</button>
            <button class="wm-pos-btn px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-400 hover:bg-gray-600 transition" data-pos="tr">右上</button>
            <button class="wm-pos-btn px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-400 hover:bg-gray-600 transition" data-pos="center">居中</button>
            <button class="wm-pos-btn px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-400 hover:bg-gray-600 transition" data-pos="bl">左下</button>
            <button class="wm-pos-btn px-2.5 py-1 text-xs rounded bg-violet-600 text-white transition" data-pos="br">右下</button>
          </div>
          <div class="flex justify-between text-xs text-gray-400">
            <span>水印透明度</span>
            <span id="watermarkOpacityVal">50%</span>
          </div>
          <input type="range" id="watermarkOpacity" min="10" max="100" value="50" step="1">
        </div>
      </div>

      <!-- ── PWA 安装按钮（默认隐藏，仅支持 PWA 时显示） ── -->
      <div class="border-t border-gray-800 pt-4">
        <button id="installBtn"
          class="hidden w-full flex items-center justify-center gap-2 py-3 bg-green-600 hover:bg-green-700
            active:scale-[0.98] rounded-lg text-sm font-medium transition install-btn-pulse">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          安装应用
        </button>
      </div>
    </div>
  </main>
